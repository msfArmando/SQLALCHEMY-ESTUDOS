[project]
name = "sql-alchemy-pratices"
version = "0.1.0"
description = ""
authors = [
    {name = "msfArmando",email = "armandomonsaof@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "oracledb (>=26.0.1,<27.0.0)",
    "kagglehub (>=1.0.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
    "typos (>=1.50.2,<2.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=sql_alchemy_pratices', '--cov-context=test']

[tool.poe.tasks]
lint.sequence = [
  { cmd = "typos --write-changes" },
  { cmd = "ruff check" },
]
format.sequence = [
  { cmd = "ruff check --fix" },
  { cmd = "ruff format" },
]
test.sequence = [
  { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
  { cmd = "coverage html --show-contexts" },
]
testreport = "poetry run coverage html --show-contexts"

[tool.poe]
poetry_command = ""